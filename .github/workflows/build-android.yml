# ══════════════════════════════════════════════════════════════════════
#  📦 بناء APK + AAB لتوفير — كلياً في السحابة (GitHub Actions)
# ══════════════════════════════════════════════════════════════════════
#  لا حاجة لأي تثبيت على جهازك (لا Android Studio / JDK / Gradle / Bun).
#  يكفي رفع كود Next.js + مجلد resources/ — والباقي يتم هنا آلياً:
#
#    1) تثبيت Bun + Java 21 + Android SDK في السحابة (Capacitor 8 يتطلب
#       Java 21 — مكتبة capacitor-android تستهدف sourceCompatibility 21)
#    2) bun install ثم npx cap add android       (إنشاء مجلد android من الصفر)
#    3) npx capacitor-assets generate --android   (كل الأيقونات/السبلاش من resources/)
#    4) bun scripts/patch-android-identity.mjs    (هوية توفير: الألوان + سبلاش
#       صلب #005B82 + الإصدار + التوقيع + فلتر روابط أندرويد العميقة
#       autoVerify لـ tawfir.giize.com + أذونات الإشعارات/الشبكة/الاهتزاز
#       + قفل الاتجاه portrait + ألوان أشرطة النظام + [إن وُجد
#       google-services.json في جذر المستودع] الإشعارات الأصلية FCM
#       بالكامل: firebase-messaging + خدمة Java تعمل في كل الحالات
#       + قناتا إشعارات (الطلبات/عام) + أيقونة إشعار نيتفة + موضوع
#       tawfir_all للإرسال من Firebase Console بلا خادم
#       — مع تحقق بنيوي آلي قبل Gradle: يضمن أن signingConfig يقع داخل
#       buildTypes→release حصراً وأن فلتر Deep Links داخل MainActivity)
#    5) npx cap sync android ثم ./gradlew assembleRelease bundleRelease
#       ← APK موقّع (للتثبيت المباشر) + AAB موقّع (للرفع على Google Play)
#    6) تحقق آلي أن بصمة SHA-256 للتوقيع تطابق assetlinks.json على
#       tawfir.giize.com (روابط أندرويد العميقة تعمل فوراً) + تحقق
#       توقيع الـAAB بـ jarsigner
#    7) رفع الـAPK + الـAAB الموقّعَين كـ Artifacts قابلة للتنزيل
#
#  الأسرار المطلوبة (Settings → Secrets and variables → Actions):
#    ANDROID_KEYSTORE_BASE64     ملف tawfeer-release.keystore بترميز Base64
#    ANDROID_KEYSTORE_PASSWORD   كلمة مرور الـKeystore
#    ANDROID_KEY_ALIAS           الاسم المستعار (tawfeer)
#    ANDROID_KEY_PASSWORD        كلمة مرور المفتاح
#    (ملاحظة: إن كان الـKeystore من نوع PKCS12 فيجب أن تكون كلمة مرور
#     المفتاح = كلمة مرور الـKeystore نفسها — هذا سلوك Java القياسي)
#
#  الإشعارات (FCM) — ملف عمومي غير سرّي يُرفع مع الكود في جذر المستودع:
#    google-services.json  (Firebase Console → Project settings → تطبيق
#    Android → تنزيل الملف). الإرسال بعدها من Firebase Console → Messaging
#    → حملة جديدة → Target: Topic = tawfir_all (اشتراك تلقائي بالتطبيق)
# ══════════════════════════════════════════════════════════════════════

name: "Build Android APK + AAB — توفير"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "أي تطبيق؟ (customer = تطبيق العملاء على Play)"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - owner
      version_name:
        description: "اسم الإصدار versionName (مثال: 1.2.0)"
        required: true
        default: "1.2.0"
        type: string
      version_code:
        description: "رقم الإصدار versionCode — يجب أن يزيد عن أي رفعة سابقة لـ Play"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ inputs.app || 'customer' }}
  cancel-in-progress: false

jobs:
  build:
    name: "🔧 توليد + توقيع APK + AAB"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.2.0' }}
      VERSION_CODE: ${{ inputs.version_code || '1' }}

    steps:
      - name: "⬇️ تحميل الكود"
        uses: actions/checkout@v5

      - name: "🔍 فحص الأسرار المطلوبة (فشل مبكر بدل 10 دقائق انتظار)"
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KS_B64" ]  && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KS_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KS_KEY" ]  && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::أسرار ناقصة:$MISSING — أضفها من Settings → Secrets and variables → Actions ثم أعد تشغيل الـWorkflow"
            exit 1
          fi
          echo "✓ الأسرار الأربعة موجودة"

      - name: "🥟 تثبيت Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "☕ تثبيت Java 21 (Temurin) — Capacitor 8 يتطلب 21"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: "🤖 تجهيز Android SDK (التراخيص + منصة 36)"
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-36" "platform-tools" >/dev/null 2>&1 || true
          echo "✓ التراخيص مقبولة ومنصة API 36 متوفرة"

      - name: "📦 تثبيت الاعتماديات (bun install)"
        run: bun install --frozen-lockfile

      - name: "🏪 هوية التطبيق المختار (تطبيق المالك عند اختياره)"
        if: ${{ inputs.app == 'owner' }}
        run: |
          sed -i 's/appId: "com.tawfir.ye.app"/appId: "com.tawfir.ye.owner"/' capacitor.config.ts
          sed -i 's/appName: "توفير"/appName: "توفير مالك"/' capacitor.config.ts
          if ! grep -q 'com.tawfir.ye.owner' capacitor.config.ts; then
            echo "::error::فشل تعديل capacitor.config.ts لهوية المالك — راجع صيغة الملف"
            exit 1
          fi
          grep -E "appId|appName" capacitor.config.ts | head -2

      - name: "🆕 إنشاء مشروع Android من الصفر (cap add android)"
        run: |
          rm -rf android
          npx cap add android

      - name: "🔍 التحقق من إنشاء المشروع"
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml غير موجود — فشل إنشاء مشروع Android"
            exit 1
          fi
          echo "✓ AndroidManifest.xml موجود"

      - name: "🎨 توليد كل الأيقونات والسبلاش من resources/ (123 ملفاً)"
        run: npx capacitor-assets generate --android

      - name: "🔐 فك Keystore من الأسرار (يدعم صيغة certutil)"
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | sed '/^-----/d' \
            | tr -d '\r\n ' \
            | base64 -d > android/tawfeer-release.keystore
          SIZE=$(stat -c%s android/tawfeer-release.keystore)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::ملف الـKeystore أصغر من المتوقع (${SIZE} بايت) — تأكد من ترميز Base64 الصحيح"
            exit 1
          fi
          echo "✓ Keystore جاهز (${SIZE} بايت)"

      - name: "🖌️ تفعيل هوية توفير + الإصدار + التوقيع (مع تحقق بنيوي آلي)"
        run: bun scripts/patch-android-identity.mjs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: "🔍 لقطة بنية build.gradle + Manifest + FCM (مقنّعة — للتوثيق في السجل)"
        run: |
          echo "── الأسطر الحرجة في app/build.gradle (كلمات المرور مقنّعة) ──"
          grep -nE "signingConfigs \{|release \{|signingConfig |storeFile|versionCode |versionName |buildTypes \{|firebase-messaging" android/app/build.gradle \
            | sed -E "s/(storePassword|keyPassword|keyAlias)[^ ]* .*/\1 '***'/" || true
          echo ""
          echo "── فلتر Deep Links والأذونات في AndroidManifest.xml ──"
          grep -nE "autoVerify|tawfir.giize.com|BROWSABLE|uses-permission|screenOrientation" android/app/src/main/AndroidManifest.xml || true
          echo ""
          echo "── عناصر الإشعارات الأصلية (FCM) في AndroidManifest.xml ──"
          grep -nE "TawfirApp|TawfirFirebaseMessagingService|MESSAGING_EVENT|default_notification" android/app/src/main/AndroidManifest.xml || echo "(FCM غير مفعّل — لا google-services.json في المستودع)"
          if [ -f android/app/google-services.json ]; then
            echo "── google-services.json (المعرّف فقط — معلومات عمومية غير سرّية) ──"
            grep -oE '"project_id"[^,]*' android/app/google-services.json || true
          fi

      - name: "🔄 مزامنة Capacitor (نسخة الويب + تسجيل الإضافات)"
        run: npx cap sync android

      - name: "🏗️ بناء APK + AAB موقّعَين (assembleRelease + bundleRelease)"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: "✅ التحقق من التوقيع: بصمة APK (assetlinks) + توقيع AAB"
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK_FILE="$(ls "$APK_DIR"/app-release*.apk | head -n1)"
          APK_NAME="$(basename "$APK_FILE")"
          echo "الـAPK الناتج: $APK_NAME"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK_FILE" | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -n1)"

          # البصمة المعلنة في assetlinks.json على tawfir.giize.com
          EXPECTED="EE:E5:C2:B7:C4:CF:94:DE:8B:07:6A:5A:B9:E6:D8:6E:CB:27:EA:AC:4B:FF:A5:65:A4:B1:16:95:A0:96:72:1D"
          EXPECTED_NORM="$(printf '%s' "$EXPECTED" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "بصمة الـAPK   : $CERT_SHA256"
          echo "بصمة المتوقعة : $EXPECTED_NORM"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::تعذر قراءة بصمة التوقيع — الـAPK غير موقّع؟"
            exit 1
          fi
          if [ "$CERT_SHA256" != "$EXPECTED_NORM" ]; then
            echo "::error::البصمة لا تطابق assetlinks.json! روابط أندرويد العميقة لن تعمل. تأكد أن ANDROID_KEYSTORE_BASE64 هو ملف tawfeer-release.keystore نفسه"
            exit 1
          fi
          echo "✓ البصمة مطابقة تماماً — Deep Links ستُتحقق آلياً 🎉"

          # معلومات الشهادة كاملة للتوثيق
          "$APKSIGNER" verify --print-certs "$APK_FILE" | grep -E "DN:|SHA-1|SHA-256" || true

          # ── التحقق من الـAAB (Android App Bundle — للرفع على Google Play) ──
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::ملف AAB غير موجود — فشل bundleRelease؟"
            exit 1
          fi
          AAB_SIZE="$(du -h "$AAB_FILE" | cut -f1)"
          echo "✓ AAB جاهز: $AAB_SIZE ($AAB_FILE)"
          if ! jarsigner -verify "$AAB_FILE" >/dev/null 2>&1; then
            echo "::error::الـAAB غير موقّع بشكل صالح — راجع إعدادات signingConfigs"
            exit 1
          fi
          echo "✓ توقيع الـAAB سليم (jarsigner) — جاهز للرفع على Google Play"

      - name: "📤 تجهيز الـArtifacts (APK + AAB + بصمات الملفين)"
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          AAB_DIR="android/app/build/outputs/bundle/release"
          APK_FILE="$(ls "$APK_DIR"/app-release*.apk | head -n1)"
          AAB_FILE="$(ls "$AAB_DIR"/*.aab | head -n1)"
          APP="${{ inputs.app || 'customer' }}"
          OUT_APK="tawfir-${APP}-v${VERSION_NAME}-${VERSION_CODE}.apk"
          OUT_AAB="tawfir-${APP}-v${VERSION_NAME}-${VERSION_CODE}.aab"
          OUT_DIR="$RUNNER_TEMP/tawfir-build"
          mkdir -p "$OUT_DIR"
          cp "$APK_FILE" "$OUT_DIR/$OUT_APK"
          cp "$AAB_FILE" "$OUT_DIR/$OUT_AAB"
          (cd "$OUT_DIR" && sha256sum "$OUT_APK" > "$OUT_APK.sha256" && sha256sum "$OUT_AAB" > "$OUT_AAB.sha256")
          ls -lh "$OUT_DIR"
          echo "APK_OUT_NAME=$OUT_APK" >> "$GITHUB_ENV"
          echo "AAB_OUT_NAME=$OUT_AAB" >> "$GITHUB_ENV"
          echo "APK_OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: "📤 رفع APK + AAB للتنزيل"
        uses: actions/upload-artifact@v4
        with:
          name: tawfir-${{ inputs.app || 'customer' }}-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            ${{ env.APK_OUT_DIR }}/*.apk
            ${{ env.APK_OUT_DIR }}/*.aab
            ${{ env.APK_OUT_DIR }}/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: "📋 ملخص البناء"
        run: |
          APK_PATH="${{ env.APK_OUT_DIR }}/${{ env.APK_OUT_NAME }}"
          AAB_PATH="${{ env.APK_OUT_DIR }}/${{ env.AAB_OUT_NAME }}"
          APK_SIZE="$(du -h "$APK_PATH" | cut -f1)"
          AAB_SIZE="$(du -h "$AAB_PATH" | cut -f1)"
          if [ -f android/app/google-services.json ]; then
            FCM_ROW="FCM أصلي ✓ — أرسل من Firebase Console للموضوع \`tawfir_all\`"
          else
            FCM_ROW="غير مفعّل (أضِف google-services.json في جذر المستودع)"
          fi
          {
            echo "## 📦 اكتمل بناء توفير لـ Android"
            echo ""
            echo "| البند | القيمة |"
            echo "|---|---|"
            echo "| التطبيق | \`${{ inputs.app || 'customer' }}\` |"
            echo "| حزمة التطبيق | \`$(grep -oP 'applicationId "\K[^"]+' android/app/build.gradle)\` |"
            echo "| الإصدار | ${VERSION_NAME} (versionCode ${VERSION_CODE}) |"
            echo "| حجم الـAPK | ${APK_SIZE} |"
            echo "| حجم الـAAB | ${AAB_SIZE} |"
            echo "| ملف الـAPK | \`${{ env.APK_OUT_NAME }}\` |"
            echo "| ملف الـAAB | \`${{ env.AAB_OUT_NAME }}\` (للرفع على Google Play) |"
            echo "| الإشعارات | ${FCM_ROW} |"
            echo ""
            echo "**بصمة SHA-256 للتوقيع مطابقة لـ assetlinks.json** ✅ (روابط أندرويد العميقة تعمل فوراً)"
            echo ""
            echo "> نزّل الـAPK من قسم **Artifacts** بالأعلى، ثم ثبّته على جهازك"
            echo "> (فعّل «التثبيت من مصادر غير معروفة» عند سؤال أندرويد)."
            echo ">"
            echo "> 📲 الـ**AAB** هو الملف المطلوب للرفع على Google Play (Production)."
            echo "> 🔔 للإشعارات: Firebase Console → Messaging → حملة جديدة →"
            echo ">    Target: Topic = \`tawfir_all\` — ستصلك على الجهاز في كل الحالات."
          } >> "$GITHUB_STEP_SUMMARY"
