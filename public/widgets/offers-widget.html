<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>عروض توفير</title>
<!--
  ودجة (Widget) «عروض توفير» — src في members.widgets بالـmanifest
  HTML مستقل بلا اعتماديات: يُعرض داخل سطح ودجات أندرويد/ويندوز
  بنمط 2x2، بلونية توفير (كحلي #0A1A2F + ذهبي). زر واحد يفتح التطبيق.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(150deg, #0a1a2f 0%, #0e2745 60%, #123258 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    text-align: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: radial-gradient(circle at 30% 25%, #f3d27a 0%, #d4af37 55%, #a8862a 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900; color: #0a1a2f;
    box-shadow: 0 3px 10px rgba(212, 175, 55, 0.35);
  }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.4px; opacity: 0.85; }
  .offer {
    width: 100%;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(212, 175, 55, 0.25);
    padding: 10px 8px;
  }
  .offer .discount {
    font-size: 22px; font-weight: 900; color: #f3d27a;
    line-height: 1.2;
  }
  .offer .label {
    font-size: 10.5px; opacity: 0.75; margin-top: 2px; line-height: 1.6;
  }
  .open-btn {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 2px;
    background: #d4af37; color: #0a1a2f;
    font-size: 11.5px; font-weight: 800;
    text-decoration: none;
    border-radius: 999px;
    padding: 8px 16px;
    min-height: 34px;
    transition: opacity 0.2s ease;
  }
  .open-btn:hover { opacity: 0.9; }
  .open-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">ت</div>
  <div class="brand">توفير — خصومات العضوية</div>
  <div class="offer">
    <div class="discount">حتى 30%</div>
    <div class="label">خصم فوري في المطاعم المشتركة ببطاقة توفير</div>
  </div>
  <!-- الودجة تُعرض خارج نطاق التطبيق: فتح في الإطار الأعلى يفتح التطبيق -->
  <a class="open-btn" href="/" target="_top">اطلب الآن</a>
</body>
</html>
